name: Project checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commitflow_test
          POSTGRES_USER: commitflow_test
          POSTGRES_PASSWORD: commitflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U commitflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip check
      - working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: commitflow.test_settings
        run: gunicorn --check-config --workers 2 --threads 4 commitflow.wsgi:application
      - working-directory: backend
        run: python -B manage.py makemigrations --check --dry-run --settings=commitflow.test_settings
      - working-directory: backend
        run: python -B manage.py test tests --settings=commitflow.postgres_test_settings
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm audit --audit-level=moderate
      - working-directory: frontend
        run: node node_modules/typescript/bin/tsc --noEmit --incremental false
      - working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
